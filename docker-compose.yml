services:
  app:
    build: .
    image: closure-call
    env_file: .env          # copied to the server separately; never committed
    expose:
      - "8000"              # reachable only by Caddy, not from the internet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2.8
    ports:
      - "80:80"             # only used to redirect to HTTPS and for certificate challenges
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data    # certificates survive restarts and redeploys
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  caddy_data:
  caddy_config:
